<main class="content fade-in">
<div class="content-inner">

    <section class="gallery">
        <img src="assets/IMG_0021.PNG" alt="Illustration 1" class="gallery-item">
        <img src="assets/IMG_0090.PNG" alt="Illustration 2" class="gallery-item">
        <img src="assets/IMG_0102.PNG" alt="Illustration 3" class="gallery-item">
        <img src="assets/IMG_0138.PNG" alt="Illustration 4" class="gallery-item">

        <img src="assets/IMG_0192.jpg" alt="Illustration 11" class="gallery-item">
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img src="" alt="">
    </div>

</div>
</main>

<footer class="footer fade-in">© 2026 Kazuya Boehringer</footer>


<script>
const images = document.querySelectorAll('.gallery-item');
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');

images.forEach(img => {
    img.addEventListener('click', () => {
        lightbox.classList.add('active');
        lightboxImg.src = img.src;
    });
});

lightbox.addEventListener('click', () => {
    lightbox.classList.remove('active');
});
</script>
