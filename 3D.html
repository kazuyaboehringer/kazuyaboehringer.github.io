<script src="https://www.youtube.com/iframe_api"></script>
<script>
const ytPlayers = {};
const ytReady = {};

function onYouTubeIframeAPIReady() {
    document.querySelectorAll('iframe[id^="yt-player"]').forEach(iframe => {
        ytPlayers[iframe.id] = new YT.Player(iframe.id, {
            events: {
                onReady: () => ytReady[iframe.id] = true
            }
        });
    });
}

function parseTime(timeStr) {
    if (timeStr.includes(':')) {
        const parts = timeStr.split(':').map(Number);
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    }
    return Number(timeStr);
}

document.addEventListener('click', function(e) {
    const link = e.target.closest('.yt-timestamp');
    if (!link) return;

    e.preventDefault();

    const playerId = link.dataset.player;
    const time = parseTime(link.dataset.time);
    const player = ytPlayers[playerId];

    if (!player || !ytReady[playerId]) return;

    player.seekTo(time, true);
    player.playVideo();

    // hard sync fix for long videos
    setTimeout(() => player.seekTo(time, true), 150);
});
</script>
